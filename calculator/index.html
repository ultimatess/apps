<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Magic Kid Calculator ⚡</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    :root {
      --bg: #090d16;
      --glass-surface: rgba(255, 255, 255, 0.05);
      --glass-border: rgba(255, 255, 255, 0.12);
      --glass-hover: rgba(255, 255, 255, 0.18);
      --glass-specular: rgba(255, 255, 255, 0.25);
      --accent-blue: #38bdf8;
      --accent-purple: #c084fc;
      --accent-amber: #fbbf24;
      --accent-emerald: #34d399;
      --accent-rose: #fb7185;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      background-color: var(--bg);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px 16px;
      background-image: 
        radial-gradient(circle at 10% 20%, rgba(56, 189, 248, 0.18) 0%, transparent 40%),
        radial-gradient(circle at 90% 80%, rgba(192, 132, 252, 0.16) 0%, transparent 45%),
        radial-gradient(circle at 50% 50%, rgba(52, 211, 153, 0.08) 0%, transparent 60%);
      background-attachment: fixed;
    }

    /* Top Navigation Header */
    .header-bar {
      width: 100%;
      max-width: 440px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .glass-pill {
      background: var(--glass-surface);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: 999px;
      padding: 6px 14px;
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
    }

    .glass-pill:hover {
      color: #fff;
      border-color: var(--glass-hover);
      transform: translateY(-1px);
    }

    /* Mode Segmented Switch */
    .mode-switch {
      display: flex;
      background: rgba(0, 0, 0, 0.35);
      border: 1px solid var(--glass-border);
      border-radius: 999px;
      padding: 3px;
      backdrop-filter: blur(10px);
    }

    .mode-btn {
      background: none;
      border: none;
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.2s ease;
      font-family: inherit;
    }

    .mode-btn.active {
      background: linear-gradient(135deg, rgba(56, 189, 248, 0.4), rgba(192, 132, 252, 0.4));
      color: #fff;
      border: 1px solid var(--glass-specular);
      box-shadow: 0 4px 12px rgba(56, 189, 248, 0.25);
    }

    /* Calculator Shell */
    .calculator-card {
      width: 100%;
      max-width: 440px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--glass-border);
      border-top: 1px solid var(--glass-specular);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border-radius: 32px;
      padding: 24px;
      box-shadow: 0 24px 60px -12px rgba(0, 0, 0, 0.7), inset 0 1px 0 rgba(255, 255, 255, 0.15);
      position: relative;
    }

    /* Display Area */
    .display-well {
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.07);
      border-radius: 24px;
      padding: 16px 20px;
      margin-bottom: 16px;
      position: relative;
      min-height: 140px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .equation-line {
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--text-muted);
      min-height: 24px;
      letter-spacing: 0.03em;
    }

    .value-line {
      font-size: clamp(2.4rem, 8vw, 3.2rem);
      font-weight: 800;
      text-align: right;
      color: #fff;
      letter-spacing: -0.02em;
      line-height: 1.1;
      font-family: 'Fredoka', sans-serif;
    }

    /* Sub-bar in Display: Visual Counting or Cheat Cue */
    .context-tray {
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      min-height: 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.9rem;
    }

    .counters-flow {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      max-height: 38px;
      overflow-y: auto;
      font-size: 1.15rem;
    }

    .counter-picker {
      display: flex;
      gap: 6px;
    }

    .emoji-chip {
      cursor: pointer;
      opacity: 0.45;
      transition: transform 0.15s, opacity 0.15s;
    }
    .emoji-chip.selected {
      opacity: 1;
      transform: scale(1.2);
    }

    /* Mental Math Cheat Box (Advance Mode) */
    .cheat-box {
      display: none;
      background: linear-gradient(135deg, rgba(192, 132, 252, 0.12), rgba(56, 189, 248, 0.08));
      border: 1px solid rgba(192, 132, 252, 0.3);
      border-radius: 16px;
      padding: 12px 16px;
      margin-bottom: 18px;
      animation: fadeIn 0.25s ease-out;
    }

    .cheat-header {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.75rem;
      font-weight: 800;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--accent-purple);
      margin-bottom: 4px;
    }

    .cheat-content {
      font-size: 0.9rem;
      font-weight: 600;
      color: #e2e8f0;
      line-height: 1.4;
    }

    .cheat-formula {
      font-family: 'Fredoka', monospace;
      color: var(--accent-amber);
      font-weight: 700;
    }

    /* Keypad Grid with Prominent Big Buttons */
    .keypad {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px;
    }

    /* Premium Big Glass Button */
    .g-btn {
      font-family: 'Fredoka', sans-serif;
      height: 72px;
      border-radius: 20px;
      border: 1px solid var(--glass-border);
      border-top: 1px solid var(--glass-specular);
      background: var(--glass-surface);
      color: var(--text-main);
      font-size: 1.85rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      box-shadow: 0 8px 16px -4px rgba(0, 0, 0, 0.3), inset 0 1px 0 rgba(255, 255, 255, 0.15);
      transition: all 0.12s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    .g-btn:hover {
      background: var(--glass-hover);
      border-color: rgba(255, 255, 255, 0.25);
      transform: translateY(-2px);
    }

    .g-btn:active {
      transform: translateY(2px) scale(0.97);
      box-shadow: 0 2px 6px rgba(0,0,0,0.4), inset 0 2px 4px rgba(0,0,0,0.2);
    }

    /* Big Operator Buttons */
    .g-btn.op {
      background: rgba(56, 189, 248, 0.12);
      border-color: rgba(56, 189, 248, 0.25);
      border-top-color: rgba(56, 189, 248, 0.5);
      color: var(--accent-blue);
      font-size: 2.1rem;
    }

    .g-btn.op:hover {
      background: rgba(56, 189, 248, 0.22);
      box-shadow: 0 8px 24px rgba(56, 189, 248, 0.25);
    }

    /* Giant Equal Button */
    .g-btn.equal {
      grid-column: span 2;
      background: linear-gradient(135deg, #10b981, #06b6d4);
      border: 1px solid rgba(255, 255, 255, 0.3);
      color: #090d16;
      font-size: 2.3rem;
      font-weight: 800;
      box-shadow: 0 8px 25px rgba(16, 185, 129, 0.35);
    }

    .g-btn.equal:hover {
      filter: brightness(1.1);
      box-shadow: 0 10px 30px rgba(16, 185, 129, 0.5);
    }

    .g-btn.clear {
      background: rgba(251, 113, 133, 0.12);
      border-color: rgba(251, 113, 133, 0.25);
      color: var(--accent-rose);
      font-size: 1.5rem;
    }

    .g-btn.back {
      background: rgba(251, 191, 36, 0.12);
      border-color: rgba(251, 191, 36, 0.25);
      color: var(--accent-amber);
      font-size: 1.5rem;
    }

    @keyframes popBounce {
      0% { transform: scale(0.92); }
      50% { transform: scale(1.06); }
      100% { transform: scale(1); }
    }

    .pop {
      animation: popBounce 0.22s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 480px) {
      .calculator-card {
        padding: 18px;
      }
      .g-btn {
        height: 66px;
        font-size: 1.7rem;
        border-radius: 16px;
      }
      .keypad {
        gap: 10px;
      }
    }
  </style>
</head>
<body>

  <div class="header-bar">
    <a href="../" class="glass-pill">← Apps</a>

    <!-- Mode Switch -->
    <div class="mode-switch">
      <button id="mode-basic-btn" class="mode-btn active" onclick="setMode('basic')">Basic 🎈</button>
      <button id="mode-adv-btn" class="mode-btn" onclick="setMode('advance')">Cheat Mode ⚡</button>
    </div>
  </div>

  <div class="calculator-card">
    
    <!-- Mental Math Cheat Sheet Banner (Visible in Advance Mode) -->
    <div id="cheat-box" class="cheat-box">
      <div class="cheat-header">
        <span>⚡ Math Cheat Secret</span>
      </div>
      <div id="cheat-content" class="cheat-content">
        Select numbers and an operation (+ or ×) to reveal mental math shortcuts!
      </div>
    </div>

    <!-- Output Screen -->
    <div class="display-well">
      <div id="equation-display" class="equation-line"></div>
      <div id="main-display" class="value-line">0</div>
      
      <div class="context-tray">
        <div id="visual-counters" class="counters-flow"></div>
        <div class="counter-picker">
          <span class="emoji-chip selected" onclick="pickTheme('🍎', this)">🍎</span>
          <span class="emoji-chip" onclick="pickTheme('⭐', this)">⭐</span>
          <span class="emoji-chip" onclick="pickTheme('🚀', this)">🚀</span>
          <span class="emoji-chip" onclick="pickTheme('🐶', this)">🐶</span>
        </div>
      </div>
    </div>

    <!-- Big Glass Keypad -->
    <div class="keypad">
      <button class="g-btn clear" onclick="clearAll()">C</button>
      <button class="g-btn op" onclick="pressOp('/')">÷</button>
      <button class="g-btn op" onclick="pressOp('*')">×</button>
      <button class="g-btn back" onclick="pressBack()">⌫</button>

      <button class="g-btn" onclick="pressNum('7')">7</button>
      <button class="g-btn" onclick="pressNum('8')">8</button>
      <button class="g-btn" onclick="pressNum('9')">9</button>
      <button class="g-btn op" onclick="pressOp('-')">−</button>

      <button class="g-btn" onclick="pressNum('4')">4</button>
      <button class="g-btn" onclick="pressNum('5')">5</button>
      <button class="g-btn" onclick="pressNum('6')">6</button>
      <button class="g-btn op" onclick="pressOp('+')">+</button>

      <button class="g-btn" onclick="pressNum('1')">1</button>
      <button class="g-btn" onclick="pressNum('2')">2</button>
      <button class="g-btn" onclick="pressNum('3')">3</button>
      <button class="g-btn op" onclick="toggleVoice()" id="voice-btn" title="Voice Narration">🔊</button>

      <button class="g-btn" onclick="pressNum('0')">0</button>
      <button class="g-btn equal" onclick="calculateResult()">=</button>
    </div>

  </div>

  <script>
    // State
    let currentInput = '0';
    let previousInput = '';
    let operator = null;
    let activeMode = 'basic'; // 'basic' | 'advance'
    let currentEmoji = '🍎';
    let voiceEnabled = true;

    // Elements
    const mainDisplay = document.getElementById('main-display');
    const equationDisplay = document.getElementById('equation-display');
    const visualCounters = document.getElementById('visual-counters');
    const cheatBox = document.getElementById('cheat-box');
    const cheatContent = document.getElementById('cheat-content');

    // Child-Friendly Audio Synthesizer (Zero External Dependencies)
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function playTone(freq, duration = 0.08, type = 'sine') {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      
      const now = audioCtx.currentTime;
      osc.frequency.setValueAtTime(freq, now);
      gain.gain.setValueAtTime(0.2, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + duration);
      osc.start(now);
      osc.stop(now + duration);
    }

    function speak(text) {
      if (!voiceEnabled || !('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const utter = new SpeechSynthesisUtterance(text);
      utter.pitch = 1.25;
      utter.rate = 1.0;
      window.speechSynthesis.speak(utter);
    }

    function toggleVoice() {
      voiceEnabled = !voiceEnabled;
      document.getElementById('voice-btn').innerText = voiceEnabled ? '🔊' : '🔇';
      speak(voiceEnabled ? 'Voice on' : '');
    }

    // Switch Basic vs Cheat Mode
    function setMode(mode) {
      activeMode = mode;
      document.getElementById('mode-basic-btn').classList.toggle('active', mode === 'basic');
      document.getElementById('mode-adv-btn').classList.toggle('active', mode === 'advance');
      cheatBox.style.display = mode === 'advance' ? 'block' : 'none';
      updateCheatStrategy();
      playTone(580, 0.1, 'triangle');
    }

    function pickTheme(emoji, el) {
      currentEmoji = emoji;
      document.querySelectorAll('.emoji-chip').forEach(c => c.classList.remove('selected'));
      el.classList.add('selected');
      renderVisuals();
      playTone(480, 0.06);
    }

    function renderVisuals() {
      visualCounters.innerHTML = '';
      const count = parseInt(currentInput) || 0;
      if (count > 0 && count <= 30) {
        visualCounters.innerText = (currentEmoji + ' ').repeat(count);
      } else if (count > 30) {
        visualCounters.innerText = `${currentEmoji} × ${count}`;
      }
    }

    function pressNum(num) {
      playTone(380 + (parseInt(num) * 25));
      if (currentInput === '0') {
        currentInput = num;
      } else if (currentInput.length < 8) {
        currentInput += num;
      }
      updateScreen();
      updateCheatStrategy();
    }

    function pressOp(op) {
      playTone(600, 0.1, 'triangle');
      if (operator !== null && previousInput !== '') {
        calculateResult(false);
      }
      operator = op;
      previousInput = currentInput;
      currentInput = '0';
      updateScreen();
      updateCheatStrategy();
    }

    function pressBack() {
      playTone(280, 0.08);
      currentInput = currentInput.slice(0, -1);
      if (!currentInput) currentInput = '0';
      updateScreen();
      updateCheatStrategy();
    }

    function clearAll() {
      playTone(240, 0.15);
      currentInput = '0';
      previousInput = '';
      operator = null;
      updateScreen();
      if (activeMode === 'advance') {
        cheatContent.innerText = "Type numbers and (+ or ×) to reveal mental math shortcuts!";
      }
    }

    function updateScreen() {
      mainDisplay.innerText = currentInput;
      const opGlyphs = { '+': '+', '-': '−', '*': '×', '/': '÷' };
      equationDisplay.innerText = operator && previousInput ? `${previousInput} ${opGlyphs[operator]}` : '';
      renderVisuals();
    }

    // Mental Math Shortcut Generator (Cheat Mode)
    function updateCheatStrategy() {
      if (activeMode !== 'advance') return;

      if (!operator || !previousInput) {
        cheatContent.innerHTML = "💡 <b>Tip:</b> Pick an operator like <span class='cheat-formula'>+</span> or <span class='cheat-formula'>×</span> to learn instant mental tricks!";
        return;
      }

      const a = parseInt(previousInput);
      const b = parseInt(currentInput);

      if (isNaN(a)) return;

      if (operator === '+') {
        if (b === 0) {
          cheatContent.innerHTML = `Adding to <b>${a}</b>? Break the next number to reach friendly round numbers like <b>${Math.ceil(a/10)*10 || 10}</b>!`;
          return;
        }

        // Trick 1: Make a Ten / Friendly Number
        const nextTen = Math.ceil(a / 10) * 10;
        const diff = nextTen - a;
        if (diff > 0 && b > diff) {
          cheatContent.innerHTML = `🚀 <b>Make-a-Ten Trick:</b> Borrow <b>${diff}</b> from ${b} to make <b>${nextTen}</b>!<br>` +
            `<span class='cheat-formula'>(${a} + ${diff}) + ${b - diff} = ${nextTen} + ${b - diff} = ${a + b}</span>`;
          return;
        }

        // Trick 2: Near Doubles
        if (Math.abs(a - b) === 1) {
          const smaller = Math.min(a, b);
          cheatContent.innerHTML = `⚡ <b>Double Plus 1 Trick:</b> Double the smaller number and add 1!<br>` +
            `<span class='cheat-formula'>(${smaller} × 2) + 1 = ${smaller * 2} + 1 = ${a + b}</span>`;
          return;
        }

        // Generic Split Trick
        cheatContent.innerHTML = `🧩 <b>Split Trick:</b> Add tens then ones!<br>` +
          `<span class='cheat-formula'>${a} + ${b}</span>`;
      } 
      
      else if (operator === '*') {
        if (b === 0) {
          if (a === 9) {
            cheatContent.innerHTML = `🖐️ <b>Finger Trick for 9s:</b> For 9 × N, the tens digit is (N - 1), and both digits always add up to 9!`;
          } else if (a === 11) {
            cheatContent.innerHTML = `⚡ <b>11s Trick:</b> Split the two digits and put their sum in the middle!`;
          } else {
            cheatContent.innerHTML = `⚡ Multiplying by <b>${a}</b>? Type the second number to see the split strategy!`;
          }
          return;
        }

        // 9s rule
        if (a === 9 || b === 9) {
          const other = a === 9 ? b : a;
          cheatContent.innerHTML = `🎯 <b>Times 9 Cheat:</b> Multiply by 10 and subtract one group!<br>` +
            `<span class='cheat-formula'>(${other} × 10) - ${other} = ${other * 10} - ${other} = ${a * b}</span>`;
          return;
        }

        // 4s rule (Double Double)
        if (a === 4 || b === 4) {
          const other = a === 4 ? b : a;
          cheatContent.innerHTML = `🚀 <b>Double-Double Cheat:</b> Double ${other} twice!<br>` +
            `<span class='cheat-formula'>${other} × 2 = ${other * 2} ➔ ${other * 2} × 2 = ${a * b}</span>`;
          return;
        }

        // 5s rule (Half of 10)
        if (a === 5 || b === 5) {
          const other = a === 5 ? b : a;
          cheatContent.innerHTML = `🎈 <b>Times 5 Cheat:</b> Multiply by 10 and cut it in half!<br>` +
            `<span class='cheat-formula'>(${other} × 10) ÷ 2 = ${other * 10} ÷ 2 = ${a * b}</span>`;
          return;
        }

        // Split & Multiply
        cheatContent.innerHTML = `🧩 <b>Break-Apart Cheat:</b> Split into simpler chunks!<br>` +
          `<span class='cheat-formula'>${a} × ${b}</span>`;
      }

      else if (operator === '-') {
        cheatContent.innerHTML = `🔍 <b>Think Addition:</b> How much do you need to add to <b>${b || '?'}</b> to reach <b>${a}</b>?`;
      }

      else if (operator === '/') {
        cheatContent.innerHTML = `🍰 <b>Fair Share:</b> Split <b>${a}</b> items into <b>${b || '?'}</b> equal piles!`;
      }
    }

    function calculateResult(celebrate = true) {
      if (!operator || previousInput === '') return;

      const a = parseFloat(previousInput);
      const b = parseFloat(currentInput);
      let res = 0;

      if (operator === '+') res = a + b;
      if (operator === '-') res = a - b;
      if (operator === '*') res = a * b;
      if (operator === '/') {
        if (b === 0) {
          speak("Cannot divide by zero!");
          mainDisplay.innerText = "Oops!";
          currentInput = '0';
          operator = null;
          previousInput = '';
          return;
        }
        res = Math.round((a / b) * 100) / 100;
      }

      currentInput = res.toString();
      equationDisplay.innerText = `${a} ${operator === '*' ? '×' : operator === '/' ? '÷' : operator} ${b} =`;
      operator = null;
      previousInput = '';

      mainDisplay.classList.add('pop');
      setTimeout(() => mainDisplay.classList.remove('pop'), 250);

      updateScreen();
      updateCheatStrategy();

      if (celebrate) {
        playTone(520, 0.2, 'triangle');
        setTimeout(() => playTone(780, 0.25, 'triangle'), 80);
        confetti({ particleCount: 40, spread: 60, origin: { y: 0.6 } });
        speak(`${res}`);
      }
    }
  </script>
</body>
</html>
