<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Apps & Tools | Arunkumar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg: #090d16;
      --card-bg: rgba(255, 255, 255, 0.03);
      --card-border: rgba(255, 255, 255, 0.08);
      --card-hover-border: rgba(255, 255, 255, 0.22);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      background-color: var(--bg);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background-image: 
        radial-gradient(circle at 15% 15%, rgba(56, 189, 248, 0.08) 0%, transparent 40%),
        radial-gradient(circle at 85% 85%, rgba(129, 140, 248, 0.06) 0%, transparent 40%);
      background-attachment: fixed;
    }

    .container {
      width: 100%;
      max-width: 1080px;
      margin: 0 auto;
      padding: 48px 24px 64px;
      flex: 1;
    }

    .nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 56px;
      font-size: 0.9rem;
    }

    .nav a {
      color: var(--text-muted);
      text-decoration: none;
      transition: color 0.2s;
    }

    .nav a:hover {
      color: var(--text-main);
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      border-radius: 9999px;
      background: rgba(56, 189, 248, 0.1);
      color: var(--accent);
      font-size: 0.8rem;
      font-weight: 600;
      border: 1px solid rgba(56, 189, 248, 0.2);
    }

    .badge-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 8px var(--accent);
    }

    .header {
      margin-bottom: 48px;
    }

    .header h1 {
      font-size: clamp(2rem, 4vw, 2.75rem);
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1.2;
      margin-bottom: 12px;
      background: linear-gradient(180deg, #ffffff 30%, #94a3b8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .header p {
      color: var(--text-muted);
      font-size: 1.05rem;
      max-width: 540px;
      line-height: 1.6;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 20px;
    }

    .card {
      position: relative;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 24px;
      text-decoration: none;
      color: inherit;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1), 
                  border-color 0.25s ease, 
                  box-shadow 0.25s ease;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .card:hover {
      transform: translateY(-4px);
      border-color: var(--card-hover-border);
      box-shadow: 0 16px 32px -8px rgba(0, 0, 0, 0.5);
    }

    .card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }

    .icon-box {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      font-weight: 700;
      color: #fff;
    }

    .arrow-icon {
      color: var(--text-muted);
      opacity: 0.6;
      transition: transform 0.2s ease, opacity 0.2s ease;
    }

    .card:hover .arrow-icon {
      transform: translate(2px, -2px);
      opacity: 1;
      color: var(--accent);
    }

    .card h3 {
      font-size: 1.15rem;
      font-weight: 600;
      letter-spacing: -0.01em;
      margin-bottom: 6px;
      text-transform: capitalize;
    }

    .card p {
      color: var(--text-muted);
      font-size: 0.88rem;
      line-height: 1.5;
    }

    .skeleton-card {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      height: 160px;
      animation: pulse 1.5s infinite ease-in-out;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 0.8; }
    }

    footer {
      border-top: 1px solid var(--card-border);
      padding: 24px;
      text-align: center;
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    @media (max-width: 640px) {
      .container {
        padding: 32px 16px 48px;
      }
      .grid {
        grid-template-columns: 1fr;
        gap: 16px;
      }
      .nav {
        margin-bottom: 36px;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="nav">
      <a href="https://arunkumars.in">← Back to Main</a>
      <div class="badge">
        <span class="badge-dot"></span>
        <span id="app-counter">Scanning...</span>
      </div>
    </div>

    <div class="header">
      <h1>Web Tools & Apps</h1>
      <p>A collection of standalone, client-side tools and experiments.</p>
    </div>

    <div id="apps-grid" class="grid">
      <div class="skeleton-card"></div>
      <div class="skeleton-card"></div>
      <div class="skeleton-card"></div>
    </div>
  </div>

  <footer>
    <p>© 2026 Arunkumar Shanmugam • Hosted via GitHub Pages</p>
  </footer>

  <script>
    // GitHub API Configuration
    const GITHUB_USERNAME = 'ultimatess'; 
    const REPO_NAME = 'apps'; 

    // Files/Folders that should not be listed as web apps
    const IGNORED = new Set(['CNAME', 'index.html', 'README.md', '.github', '.git', 'assets']);

    const GRADIENTS = [
      'linear-gradient(135deg, #38bdf8, #2563eb)',
      'linear-gradient(135deg, #a855f7, #6366f1)',
      'linear-gradient(135deg, #f97316, #ec4899)',
      'linear-gradient(135deg, #10b981, #06b6d4)',
      'linear-gradient(135deg, #eab308, #ea580c)'
    ];

    function hashString(str) {
      let hash = 0;
      for (let i = 0; i < str.length; i++) hash = (hash << 5) - hash + str.charCodeAt(i);
      return Math.abs(hash);
    }

    async function loadApps() {
      const grid = document.getElementById('apps-grid');
      const counter = document.getElementById('app-counter');

      try {
        const response = await fetch(`https://api.github.com/repos/${GITHUB_USERNAME}/${REPO_NAME}/contents/`);
        if (!response.ok) throw new Error('Repository scan failed');

        const items = await response.json();
        const apps = items.filter(item => item.type === 'dir' && !IGNORED.has(item.name));

        grid.innerHTML = '';
        counter.textContent = `${apps.length} App${apps.length === 1 ? '' : 's'}`;

        if (apps.length === 0) {
          grid.innerHTML = `<p style="color: var(--text-muted); grid-column: 1 / -1;">No applications found yet. Add a subfolder to create one!</p>`;
          return;
        }

        apps.forEach(app => {
          const title = app.name.replace(/[-_]/g, ' ');
          const initial = title.charAt(0).toUpperCase();
          const gradient = GRADIENTS[hashString(app.name) % GRADIENTS.length];

          const card = document.createElement('a');
          card.className = 'card';
          card.href = `./${app.name}/`;

          card.innerHTML = `
            <div>
              <div class="card-top">
                <div class="icon-box" style="background: ${gradient};">
                  ${initial}
                </div>
                <svg class="arrow-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <line x1="7" y1="17" x2="17" y2="7"></line>
                  <polyline points="7 7 17 7 17 17"></polyline>
                </svg>
              </div>
              <h3>${title}</h3>
              <p>Simple client-side tool</p>
            </div>
          `;
          grid.appendChild(card);
        });

      } catch (err) {
        console.error(err);
        grid.innerHTML = `<p style="color: #ef4444; grid-column: 1 / -1;">Unable to load apps list right now.</p>`;
        counter.textContent = 'Offline';
      }
    }

    loadApps();
  </script>
</body>
</html>
